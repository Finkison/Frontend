<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline Mode — Finkison Learning Engine</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 480px;
      background: #1e293b;
      border: 1px solid #334155;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }
    .badge {
      display: inline-block;
      padding: 0.25rem 0.75rem;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 9999px;
      margin-bottom: 1rem;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 800;
      margin: 0 0 0.75rem 0;
    }
    p {
      font-size: 0.875rem;
      color: #94a3b8;
      line-height: 1.5;
      margin: 0 0 1.5rem 0;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.875rem;
      border-radius: 0.75rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
    }
    .btn:hover {
      background: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="badge">Ethiopia Offline First</div>
    <h1>You are currently offline</h1>
    <p>
      Don't worry! Finkison caches your curriculum lessons, flashcards, and practice drills locally. 
      Your answers and SRS reviews are stored in IndexedDB and will automatically sync once your connection is restored.
    </p>
    <button class="btn" onclick="window.location.reload()">Check Connection & Retry</button>
  </div>
</body>
</html>

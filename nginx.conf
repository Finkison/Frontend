server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 28m;
    include /etc/nginx/snippets/finkison-security-headers.conf;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets with hashes
    location /assets/ {
        # Repeat the shared headers because this location sets its own Cache-Control header.
        include /etc/nginx/snippets/finkison-security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        # Repeat the shared headers because this location sets its own Cache-Control header.
        include /etc/nginx/snippets/finkison-security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA Client-Side Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Serve the separate platform-admin app on the same origin as the API.
    location = /platform-admin {
        return 301 /platform-admin/;
    }

    location ^~ /platform-admin/ {
        proxy_pass http://platform_admin:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Reverse proxy API calls to Django backend
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
